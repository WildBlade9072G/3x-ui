<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>اطلاعات اشتراک</title>
<style>
:root{
  --bg0:#0a0b0f; --bg1:#12141c; --card:rgba(23,26,35,.72);
  --line:rgba(255,255,255,.09); --txt:#eef0f5; --dim:#98a1b3;
  --acc:#7c5cff; --acc2:#22d3ee; --on:#22c55e; --off:#64748b;
  --shadow:0 18px 50px rgba(0,0,0,.55);
}
html[data-t="light"]{
  --bg0:#eef1f7; --bg1:#dde3ee; --card:rgba(255,255,255,.82);
  --line:rgba(15,23,42,.10); --txt:#0f172a; --dim:#5b6577;
  --shadow:0 18px 44px rgba(15,23,42,.14);
}
html[data-t="gray"]{
  --bg0:#1c1f26; --bg1:#282c36; --card:rgba(52,58,70,.72);
  --line:rgba(255,255,255,.11); --txt:#e8eaef; --dim:#a6aebd;
  --shadow:0 18px 44px rgba(0,0,0,.42);
}
*{box-sizing:border-box}
body{
  margin:0;padding:18px 14px 40px;min-height:100vh;color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(124,92,255,.30), transparent 60%),
    radial-gradient(900px 520px at 88% 8%, rgba(34,211,238,.20), transparent 62%),
    linear-gradient(160deg,var(--bg0),var(--bg1));
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 22%,#000,transparent 78%);
}
.wrap{position:relative;z-index:1;max-width:660px;margin:0 auto}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.title{font-size:17px;font-weight:700;flex:1;min-width:130px}
.sid{
  font-size:11px;color:var(--dim);background:rgba(124,92,255,.14);
  border:1px solid rgba(124,92,255,.28);padding:4px 10px;border-radius:999px;
  font-family:ui-monospace,monospace;
}
.ico{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
  background:transparent;color:var(--txt);cursor:pointer;font-size:15px;
  display:grid;place-items:center;transition:.18s;flex-shrink:0;
}
.ico:hover{background:rgba(124,92,255,.16);transform:translateY(-1px)}
.ring{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.donut{position:relative;width:96px;height:96px;flex-shrink:0}
.donut svg{transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;
  font-size:15px;font-weight:800}
.meta{flex:1;min-width:0}
.meta .big{font-size:20px;font-weight:800;margin-bottom:3px}
.meta .sml{font-size:12px;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;
  border-radius:999px;font-size:12px;font-weight:700;margin-top:9px}
.pill.on{background:rgba(34,197,94,.16);color:var(--on)}
.pill.off{background:rgba(100,116,139,.18);color:var(--off)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.on .dot{animation:pulse 1.7s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
table{width:100%;border-collapse:collapse}
td{padding:12px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
td:first-child{color:var(--dim);width:44%}
tr:last-child td{border-bottom:none}
.sec{display:flex;align-items:center;gap:10px;margin:20px 0 12px;
  font-size:12px;color:var(--dim);font-weight:600}
.sec::before,.sec::after{content:"";height:1px;background:var(--line);flex:1}
.item{
  display:flex;gap:9px;align-items:center;padding:12px;margin-bottom:9px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:13px;transition:.18s;
}
.item:hover{border-color:rgba(124,92,255,.42)}
.item .nm{flex:1;min-width:0}
.item .t1{font-size:13px;font-weight:700;word-break:break-all;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.item .em{font-size:11px;color:var(--dim);margin-top:4px}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:999px;white-space:nowrap;
  background:linear-gradient(135deg,rgba(124,92,255,.22),rgba(34,211,238,.18));
  border:1px solid rgba(124,92,255,.34);color:var(--txt);
}
.b{
  border:0;border-radius:10px;padding:8px 13px;font-size:12px;cursor:pointer;
  font-family:inherit;font-weight:700;transition:.18s;flex-shrink:0;
  background:linear-gradient(135deg,var(--acc),#5b3fd6);color:#fff;
}
.b.g{background:transparent;border:1px solid var(--line);color:var(--txt)}
.b:active{transform:scale(.94)}
.urlbox{
  font-size:11.5px;color:var(--dim);word-break:break-all;
  background:rgba(0,0,0,.22);border:1px solid var(--line);
  border-radius:12px;padding:12px;margin-bottom:10px;
  font-family:ui-monospace,monospace;line-height:1.6;
}
.row2{display:flex;gap:9px;flex-wrap:wrap}
.qr{display:none;place-items:center;padding:18px;margin-top:10px;
  background:#fff;border-radius:14px}
.qr.show{display:grid}
.qr canvas{max-width:210px;width:100%;height:auto;display:block;image-rendering:pixelated}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);
  background:var(--acc);color:#fff;padding:11px 22px;border-radius:999px;
  font-size:13px;font-weight:700;z-index:99;transition:transform .3s;
  box-shadow:0 8px 26px rgba(124,92,255,.5);
}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="top">
      <div class="title" data-i="title">اطلاعات اشتراک</div>
      <span class="sid">{{.sId}}</span>
      <button class="ico" id="bt" title="theme">◐</button>
      <button class="ico" id="bl" title="lang">فا</button>
    </div>

    <div class="ring">
      <div class="donut">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="41" fill="none" stroke="rgba(128,128,128,.22)" stroke-width="8"/>
          <circle id="arc" cx="48" cy="48" r="41" fill="none" stroke="url(#g)"
                  stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="257.6" stroke-dashoffset="257.6"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#22d3ee"/>
          </linearGradient></defs>
        </svg>
        <div class="mid" id="pct">0%</div>
      </div>
      <div class="meta">
        <div class="big" id="mUsed">0.00B</div>
        <div class="sml"><span data-i="of">از</span> <span id="mTot">∞</span></div>
        <div id="mSt"><span class="pill off"><span class="dot"></span><span data-i="off">آفلاین</span></span></div>
      </div>
    </div>

    <table>
      <tr><td data-i="email">ایمیل</td><td id="tEmail">—</td></tr>
      <tr><td data-i="device">آخرین دستگاه</td><td id="tDev">—</td></tr>
      <tr><td data-i="last">آخرین اتصال</td><td id="tLast">—</td></tr>
      <tr><td data-i="dl">دانلود</td><td id="tDl">{{.download}}</td></tr>
      <tr><td data-i="ul">آپلود</td><td id="tUl">{{.upload}}</td></tr>
      <tr><td data-i="rem">باقیمانده</td><td id="tRem">—</td></tr>
      <tr><td data-i="exp">تاریخ پایان</td><td id="tExp">—</td></tr>
      <tr><td data-i="left">روز باقیمانده</td><td id="tLeft">—</td></tr>
    </table>
  </div>

  <div class="card">
    <div class="sec" data-i="sublink">لینک اشتراک</div>
    <div class="urlbox" id="uSub">{{.subUrl}}</div>
    <div class="row2">
      <button class="b" onclick="cp(SUBU)"><span data-i="copy">کپی لینک</span></button>
      <button class="b g" onclick="qr('qSub',SUBU)"><span data-i="qr">کد QR</span></button>
    </div>
    <div class="qr" id="qSub"></div>

    <div class="sec" data-i="configs">کانفیگ‌ها</div>
    <div id="list"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="qrcode.js"></script>
<script>
var LINKS  = {{.links}};
var EMAILS = {{.emails}};
var LAST   = {{.lastOnline}};
var EXPIRE = {{.expire}};
var DLB    = {{.downloadByte}};
var ULB    = {{.uploadByte}};
var TOTB   = {{.totalByte}};
var SUBU   = "{{.subUrl}}";

var T={
 fa:{title:"اطلاعات اشتراک",of:"از",on:"آنلاین",off:"آفلاین",email:"ایمیل",
  device:"آخرین دستگاه",last:"آخرین اتصال",dl:"دانلود",ul:"آپلود",rem:"باقیمانده",
  exp:"تاریخ پایان",left:"روز باقیمانده",unl:"نامحدود",sublink:"لینک اشتراک",
  configs:"کانفیگ‌ها",copy:"کپی لینک",qr:"کد QR",copied:"کپی شد",
  never:"تاکنون متصل نشده",noexp:"بدون انقضا",now:"چند لحظه پیش",min:"دقیقه پیش",
  hr:"ساعت پیش",day:"روز پیش",none:"کانفیگی موجود نیست",cp:"کپی",unk:"نامشخص"},
 en:{title:"Subscription Info",of:"of",on:"Online",off:"Offline",email:"Email",
  device:"Last Device",last:"Last Seen",dl:"Download",ul:"Upload",rem:"Remaining",
  exp:"Expire Date",left:"Days Left",unl:"Unlimited",sublink:"Subscription Link",
  configs:"Configs",copy:"Copy Link",qr:"QR Code",copied:"Copied",
  never:"Never connected",noexp:"No expiry",now:"just now",min:"min ago",
  hr:"hr ago",day:"days ago",none:"No configs",cp:"Copy",unk:"Unknown"},
 ru:{title:"Информация",of:"из",on:"Онлайн",off:"Офлайн",email:"Эл. почта",
  device:"Устройство",last:"Был онлайн",dl:"Загрузка",ul:"Отдача",rem:"Осталось",
  exp:"Дата окончания",left:"Дней осталось",unl:"Безлимит",sublink:"Ссылка подписки",
  configs:"Конфиги",copy:"Копировать",qr:"QR-код",copied:"Скопировано",
  never:"Не подключался",noexp:"Без срока",now:"только что",min:"мин назад",
  hr:"ч назад",day:"дн назад",none:"Нет конфигов",cp:"Копия",unk:"Неизвестно"}
};
var LANGS=["fa","en","ru"],LBL={fa:"فا",en:"EN",ru:"RU"};
var lang=localStorage.getItem("sl")||"fa";
var THEMES=["dark","light","gray"],GL={dark:"◐",light:"☀",gray:"◑"};
var theme=localStorage.getItem("st")||"dark";
function t(k){return (T[lang]&&T[lang][k])||T.fa[k]||k;}

function fmtB(b){
  if(b===null||b===undefined||isNaN(b))return "0.00B";
  if(b<1024)return b.toFixed(0)+"B";
  var u=["KB","MB","GB","TB"],i=-1,v=b;
  do{v/=1024;i++;}while(v>=1024&&i<u.length-1);
  return v.toFixed(2)+u[i];
}
function applyLang(){
  document.documentElement.lang=lang;
  document.documentElement.dir=(lang==="fa")?"rtl":"ltr";
  var n=document.querySelectorAll("[data-i]");
  for(var i=0;i<n.length;i++)n[i].textContent=t(n[i].getAttribute("data-i"));
  document.getElementById("bl").textContent=LBL[lang];
  render();
}
function applyTheme(){
  document.documentElement.setAttribute("data-t",theme);
  document.getElementById("bt").textContent=GL[theme];
}
document.getElementById("bl").onclick=function(){
  lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];
  localStorage.setItem("sl",lang);applyLang();
};
document.getElementById("bt").onclick=function(){
  theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];
  localStorage.setItem("st",theme);applyTheme();
};
function nameOf(l){
  var i=l.indexOf("#");if(i<0)return "Config";
  try{return decodeURIComponent(l.slice(i+1));}catch(e){return l.slice(i+1);}
}
function detectDev(){
  var u=navigator.userAgent||"",d=navigator.userAgentData;
  if(d&&d.platform){
    if(d.platform==="Android")return andr(u);
    if(d.platform==="Windows")return "Windows";
    if(d.platform==="macOS")return "macOS";
  }
  if(/iPad/i.test(u))return "iPad";
  if(/iPhone/i.test(u))return "iPhone";
  if(/iPod/i.test(u))return "iPod";
  if(/Macintosh/i.test(u)&&navigator.maxTouchPoints>1)return "iPad";
  if(/Android/i.test(u))return andr(u);
  if(/Windows/i.test(u))return "Windows";
  if(/Macintosh|Mac OS X/i.test(u))return "macOS";
  if(/CrOS/i.test(u))return "ChromeOS";
  if(/Linux/i.test(u))return "Linux";
  return t("unk");
}
function andr(u){
  var b=[[/Redmi/i,"Redmi"],[/POCO/i,"POCO"],
   [/Xiaomi|MI\s|M2\d{3}|22\d{6}|23\d{6}/i,"Xiaomi"],
   [/SM-|Samsung|Galaxy/i,"Samsung"],[/Honor/i,"Honor"],
   [/HUAWEI|HMA-|ANE-|VOG-|ELS-/i,"Huawei"],[/OPPO|CPH\d{4}/i,"OPPO"],
   [/vivo|V\d{4}A/i,"vivo"],[/OnePlus|GM\d{4}|IN\d{4}|KB\d{4}/i,"OnePlus"],
   [/realme|RMX\d{4}/i,"realme"],[/Pixel/i,"Google Pixel"],
   [/Nokia|TA-\d{4}/i,"Nokia"],[/Motorola|moto/i,"Motorola"],
   [/LG-|LM-/i,"LG"],[/Infinix/i,"Infinix"],[/Tecno/i,"Tecno"],
   [/itel/i,"itel"],[/ZTE/i,"ZTE"],[/Lenovo/i,"Lenovo"],[/ASUS/i,"ASUS"],
   [/Sony|XQ-|SO-\d{2}/i,"Sony"],[/Nothing|A0\d{2}/i,"Nothing"],
   [/HTC/i,"HTC"],[/Meizu/i,"Meizu"]];
  for(var i=0;i<b.length;i++)if(b[i][0].test(u))return b[i][1]+" · Android";
  return "Android";
}
function fmtD(ms){
  var loc=lang==="fa"?"fa-IR":(lang==="ru"?"ru-RU":"en-GB");
  try{return new Date(ms).toLocaleString(loc,
    {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});}
  catch(e){return new Date(ms).toLocaleString();}
}
function ago(ms){
  var s=Math.floor(ms/1000);
  if(s<60)return t("now");
  if(s<3600)return Math.floor(s/60)+" "+t("min");
  if(s<86400)return Math.floor(s/3600)+" "+t("hr");
  return Math.floor(s/86400)+" "+t("day");
}
function render(){
  document.getElementById("tDev").textContent=detectDev();
  document.getElementById("tEmail").textContent=(EMAILS&&EMAILS.length)?EMAILS[0]:"—";
  var used=DLB+ULB;
  document.getElementById("mUsed").textContent=fmtB(used);
  document.getElementById("mTot").textContent=TOTB>0?fmtB(TOTB):"∞";
  document.getElementById("tDl").textContent=fmtB(DLB);
  document.getElementById("tUl").textContent=fmtB(ULB);
  document.getElementById("tRem").textContent=
    TOTB>0?fmtB(Math.max(TOTB-used,0)):t("unl");

  var st=document.getElementById("mSt"),lo=document.getElementById("tLast");
  if(!LAST||LAST<=0){
    st.innerHTML='<span class="pill off"><span class="dot"></span>'+t("off")+'</span>';
    lo.textContent=t("never");
  }else{
    var ms=LAST>1e12?LAST:LAST*1000,df=Date.now()-ms;
    st.innerHTML=df<180000
      ?'<span class="pill on"><span class="dot"></span>'+t("on")+'</span>'
      :'<span class="pill off"><span class="dot"></span>'+t("off")+'</span>';
    lo.textContent=fmtD(ms)+" · "+ago(df);
  }
  var ex=document.getElementById("tExp"),lf=document.getElementById("tLeft");
  if(!EXPIRE||EXPIRE<=0){ex.textContent=t("noexp");lf.textContent="∞";}
  else{
    var e=EXPIRE>1e12?EXPIRE:EXPIRE*1000;
    ex.textContent=fmtD(e);
    var d=Math.ceil((e-Date.now())/86400000);
    lf.textContent=d>0?d:"0";
  }
  var p=(TOTB>0)?Math.min(100,used/TOTB*100):0;
  document.getElementById("pct").textContent=(TOTB>0)?p.toFixed(0)+"%":"∞";
  document.getElementById("arc").style.strokeDashoffset=257.6*(1-p/100);

  var box=document.getElementById("list");box.innerHTML="";
  if(!LINKS||!LINKS.length){
    box.innerHTML='<div class="urlbox">'+t("none")+'</div>';return;
  }
  var per=LINKS.length>0?used/LINKS.length:0;
  for(var i=0;i<LINKS.length;i++){
    (function(link,idx){
      var it=document.createElement("div");it.className="item";
      var nm=document.createElement("div");nm.className="nm";
      var t1=document.createElement("div");t1.className="t1";
      var sp=document.createElement("span");sp.textContent=nameOf(link);
      var tg=document.createElement("span");tg.className="tag";
      tg.textContent="📊 "+fmtB(per);
      t1.appendChild(sp);t1.appendChild(tg);nm.appendChild(t1);
      if(EMAILS&&EMAILS[idx]){
        var em=document.createElement("div");em.className="em";
        em.textContent=EMAILS[idx];nm.appendChild(em);
      }
      var b1=document.createElement("button");b1.className="b";
      b1.textContent=t("cp");b1.onclick=function(){cp(link);};
      var b2=document.createElement("button");b2.className="b g";
      b2.textContent="QR";b2.onclick=function(){qr("q"+idx,link);};
      var q=document.createElement("div");q.className="qr";q.id="q"+idx;
      it.appendChild(nm);it.appendChild(b1);it.appendChild(b2);
      box.appendChild(it);box.appendChild(q);
    })(LINKS[i],i);
  }
}

/* ---- QR: کتابخانه محلی، بدون هیچ درخواست بیرونی ---- */
function qr(id,text){
  var el=document.getElementById(id);
  if(el.classList.contains("show")){el.classList.remove("show");return;}
  if(!el.dataset.done){
    var q=null;
    for(var ty=4;ty<=40;ty++){
      try{ var t2=qrcode(ty,"M"); t2.addData(text); t2.make(); q=t2; break; }catch(e){}
    }
    if(!q){el.textContent="—";el.dataset.done="1";el.classList.add("show");return;}
    var n=q.getModuleCount(),pad=4,s=4,cv=document.createElement("canvas");
    cv.width=cv.height=(n+pad*2)*s;
    var g=cv.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
    g.fillStyle="#000";
    for(var r=0;r<n;r++)for(var c3=0;c3<n;c3++)
      if(q.isDark(r,c3))g.fillRect((c3+pad)*s,(r+pad)*s,s,s);
    el.appendChild(cv);el.dataset.done="1";
  }
  el.classList.add("show");
}
function cp(text){
  var done=function(){
    var e=document.getElementById("toast");
    e.textContent=t("copied");e.classList.add("show");
    setTimeout(function(){e.classList.remove("show");},1500);
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(text).then(done,function(){fb(text,done);});
  }else fb(text,done);
}
function fb(text,done){
  var a=document.createElement("textarea");
  a.value=text;a.style.position="fixed";a.style.opacity="0";
  document.body.appendChild(a);a.select();
  try{document.execCommand("copy");done();}catch(e){}
  document.body.removeChild(a);
}
applyTheme();applyLang();
setInterval(render,30000);
</script>
</body>
</html>
